repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: black (python)

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)

  - repo: local
    hooks:
      - id: notebook-outputs
        name: Check notebooks have no cell outputs
        entry: python scripts/check_notebook_outputs.py
        language: system
        files: ^examples/.*\.ipynb$
        stages: [pre-commit, manual]
